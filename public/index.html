<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Beam Reticle Repair System | 电子束掩膜版修复系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { height: 100%; width: 100%; overflow: hidden; }
    body {
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: #0a0e17;
      color: #e0e6f0;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0e17;
      z-index: 9999;
    }
    #loading .spinner {
      width: 60px;
      height: 60px;
      border: 4px solid #1a2840;
      border-top-color: #00d4ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    #loading .text {
      margin-top: 24px;
      font-size: 16px;
      color: #7a8ba8;
      letter-spacing: 2px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div class="text">E-BEAM RETICLE REPAIR SYSTEM INITIALIZING...</div>
  </div>
  <div id="root"></div>
</body>
</html>
